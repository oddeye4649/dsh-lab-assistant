name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: npm test
      - name: DSH plugin self-check
        run: npm run selfcheck
      - name: Package checks
        run: npm run pack:check
      - name: Publish scan (secrets / local paths)
        run: npm run publish:check
